name: OTA Release - Staging

on:
  push:
    branches:
      - main

jobs:
  update-staging:
    name: Publish OTA to Staging Channel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Expo CLI
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Publish OTA Update to Staging
        run: |
          eas update --channel staging --auto-message